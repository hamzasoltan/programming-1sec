<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Programming Course</title>
<style>
:root{--bg:#080611;--card:#120d1d;--card2:#181126;--line:#2b203d;--text:#f7f2fb;--muted:#a99db7;--purple:#8b5cf6;--purple2:#6d28d9;--green:#22c55e;--red:#ef4444}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#24123d 0,#080611 45%);color:var(--text);font-family:Tahoma,Arial,sans-serif;min-height:100vh}
.container{width:min(1120px,92%);margin:auto;padding:38px 0 60px}
.hero{padding:34px 0 25px}.eyebrow{color:#bfa7dc;font-size:13px;font-weight:bold;letter-spacing:1px}.hero h1{font-size:clamp(30px,5vw,52px);margin:10px 0 8px}.hero p{color:var(--muted);margin:0;line-height:1.8}
.progress-card{background:linear-gradient(145deg,#171024,#0f0a17);border:1px solid var(--line);border-radius:22px;padding:20px;margin:10px 0 28px}
.progress-top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:12px}.progress-top span:last-child{color:#cbb9dd;font-weight:bold}
.progress{height:10px;background:#21172e;border-radius:99px;overflow:hidden}.progress div{height:100%;width:0;background:linear-gradient(90deg,var(--purple2),var(--purple));transition:.35s}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.stage{position:relative;background:linear-gradient(145deg,var(--card),#0e0916);border:1px solid var(--line);border-radius:19px;padding:19px;min-height:145px;transition:.2s}.stage.unlocked:hover{transform:translateY(-2px);border-color:#55377b}.stage.locked{opacity:.62}.stage.done{border-color:#245f39}.num{font-size:12px;color:#9f8bb2}.stage-title{font-size:20px;font-weight:800;margin:8px 0}.status{font-size:13px;color:var(--muted)}.stage.done .status{color:#6ee7a0}.stage.unlocked .status{color:#c4b5fd}.stage-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.btn{border:0;border-radius:11px;padding:10px 13px;color:white;text-decoration:none;font-weight:bold;font-size:13px;cursor:pointer;background:#21172e}.btn.primary{background:linear-gradient(135deg,var(--purple),var(--purple2))}.btn:disabled{opacity:.4;cursor:not-allowed}.content-links{display:none;gap:7px;flex-wrap:wrap}.unlocked .content-links{display:flex}.lock{position:absolute;left:18px;top:18px;font-size:18px}
.notice{margin-top:24px;padding:15px 17px;border-radius:15px;background:#100c18;border:1px solid var(--line);color:var(--muted);line-height:1.8}
@media(max-width:720px){.grid{grid-template-columns:1fr}.container{padding-top:24px}.stage{min-height:auto}.hero h1{font-size:34px}}
</style>
</head>
<body>
<main class="container">
<section class="hero">
<div class="eyebrow">PROGRAMMING COURSE</div>
<h1>مسار تعلم البرمجة</h1>
<p>ادرس المحتوى، شاهد الشرح، ثم اجتز الامتحان لفتح المرحلة التالية.</p>
</section>

<section class="progress-card">
<div class="progress-top"><strong>تقدمك في الكورس</strong><span id="progressText">0 / 17</span></div>
<div class="progress"><div id="progressBar"></div></div>
</section>

<section id="stages" class="grid"></section>

<div class="notice">
<strong>نظام الفتح:</strong> تبدأ من Chapter 1. تحتاج إلى الحصول على <strong>60%</strong> أو أكثر في امتحان كل مرحلة لفتح المرحلة التالية.
</div>
</main>

<script>
const CONFIG_FILE="links.json";
let config=null;
let progress={};

function loadProgress(){
  try{progress=JSON.parse(localStorage.getItem("programmingCourseProgress")||"{}")}catch(e){progress={}}
}
function saveProgress(){localStorage.setItem("programmingCourseProgress",JSON.stringify(progress))}
function isUnlocked(index){
  if(index===0)return true;
  return !!progress[config.stages_order[index-1]];
}
function isDone(key){return !!progress[key]?.passed}

function render(){
  const container=document.getElementById("stages");
  container.innerHTML="";
  let doneCount=0;
  config.stages_order.forEach((key,index)=>{
    const item=config.links[key];
    const unlocked=isUnlocked(index);
    const done=isDone(key);
    if(done)doneCount++;
    const article=document.createElement("article");
    article.className=`stage ${unlocked?"unlocked":"locked"} ${done?"done":""}`;
    article.innerHTML=`
      ${!unlocked?'<div class="lock">🔒</div>':''}
      <div class="num">المرحلة ${String(index+1).padStart(2,"0")}</div>
      <div class="stage-title">${item.title}</div>
      <div class="status">${done?"✓ تم اجتياز المرحلة":unlocked?"متاحة للدراسة":"أكمل المرحلة السابقة أولاً"}</div>
      ${unlocked?`
      <div class="content-links">
        ${item.book?`<a class="btn" href="${item.book}" target="_blank">📖 كتاب المدرسة</a>`:""}
        ${item.summary?`<a class="btn" href="${item.summary}" target="_blank">📄 الملخص</a>`:""}
        ${item.video?`<a class="btn" href="${item.video}" target="_blank">🎬 فيديو الشرح</a>`:""}
        ${item.exam?`<a class="btn primary" href="${item.exam}">📝 الامتحان</a>`:""}
      </div>`:""}
    `;
    container.appendChild(article);
  });
  const percent=Math.round((doneCount/config.stages_order.length)*100);
  document.getElementById("progressText").textContent=`${doneCount} / ${config.stages_order.length}`;
  document.getElementById("progressBar").style.width=percent+"%";
}

async function init(){
  loadProgress();
  try{
    const response=await fetch(CONFIG_FILE,{cache:"no-store"});
    config=await response.json();
    render();
  }catch(error){
    document.getElementById("stages").innerHTML='<div class="notice">تعذر تحميل links.json. تأكد أن الملف موجود بجوار index.html.</div>';
  }
}
init();
</script>
</body>
</html>
