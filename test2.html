.card{background:linear-gradient(180deg,rgba(14,34,29,.98),rgba(7,18,15,.98));border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 60px #0006;padding:25px}.top{display:flex;justify-content:space-between;gap:12px}.badge{border:1px solid var(--line);padding:7px 11px;border-radius:999px;color:#b9e7dd;font-size:12px}h1{font-size:clamp(22px,4vw,35px);line-height:1.4;margin:12px 0}.qmeta{display:flex;justify-content:space-between;color:#9ed4c9;font-size:12px}.progress{height:8px;background:#03100c;border:1px solid var(--line);border-radius:99px;overflow:hidden;margin:18px 0}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--teal2))}.question{font-size:19px;line-height:2;margin:20px 0}.options{display:grid;gap:11px}.option{display:flex;gap:12px;align-items:flex-start;border:1px solid #214f45;background:#071511;border-radius:14px;padding:15px;cursor:pointer;transition:.18s}.option:hover{border-color:var(--teal2);transform:translateY(-1px)}.option.selected{border-color:var(--teal2);background:#0b2821}.option input{accent-color:var(--teal2);margin-top:5px}.actions{display:flex;gap:10px;justify-content:space-between;margin-top:24px;flex-wrap:wrap}button{border:0;border-radius:12px;padding:13px 18px;font:inherit;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,var(--teal2),var(--teal));color:#fff}.secondary{background:#091713;color:#d8eee9;border:1px solid var(--line)}button:disabled{opacity:.42}

/* PROGRAM 1SEC — NovaPay-inspired visual system */
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Outfit:wght@500;600;700;800&display=swap');
:root{
  --np-bg:#0F1319;--np-bg2:#141920;--np-bg3:#1A2130;--np-bg4:#1E2838;
  --np-sky:#4A9EE8;--np-sky2:#7EC8F0;--np-sky3:#2A6AAA;
  --np-text:#E4EEF8;--np-text2:#8AAEC8;--np-text3:#506070;
  --np-border:#1E3050;--np-border2:#2A4060;
  --np-green:#3DCC8E;--np-red:#E85A5A;
  --bg:var(--np-bg);--bg2:var(--np-bg2);--panel:var(--np-bg3);--panel2:var(--np-bg4);
  --line:var(--np-border);--teal:var(--np-sky3);--teal2:var(--np-sky);--text:var(--np-text);--muted:var(--np-text2);
  --good:var(--np-green);--bad:var(--np-red);
  --silk:cubic-bezier(.16,1,.3,1);
}
html{scroll-behavior:smooth}
body{
  font-family:'DM Sans',sans-serif!important;
  background:var(--np-bg)!important;color:var(--np-text)!important;
  transition:background .7s var(--silk),color .7s var(--silk)!important;
}
h1,h2,h3,.brand,.title,.score,.stage .num,.eyebrow,.ask-title{font-family:'Outfit',sans-serif!important;letter-spacing:-.02em}
/* layered diagonal grid / editorial background */
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.32;
  background-image:
    repeating-linear-gradient(45deg,transparent 0,transparent 119px,rgba(74,158,232,.13) 119px,rgba(74,158,232,.13) 120px),
    repeating-linear-gradient(-45deg,transparent 0,transparent 119px,rgba(74,158,232,.08) 119px,rgba(74,158,232,.08) 120px);
  mask-image:radial-gradient(ellipse 90% 80% at 50% 0,#000 0%,transparent 82%);
}
.navbar{
  background:rgba(15,19,25,.78)!important;border-bottom:1px solid var(--np-border)!important;
  backdrop-filter:blur(20px)!important;
  box-shadow:0 12px 40px rgba(0,0,0,.18);
}
.nav-inner{height:68px}
.brand{font-weight:800!important;color:var(--np-text)!important}
.brand span{color:var(--np-sky)!important}
.nav-links a,.mobile-menu a{color:var(--np-text2)!important;transition:color .5s var(--silk),background .5s var(--silk),transform .5s var(--silk)!important}
.nav-links a:hover,.mobile-menu a:hover{color:var(--np-text)!important;transform:translateY(-1px)}
.theme-btn,.menu-btn{
  background:var(--np-bg2)!important;border:1px solid var(--np-border2)!important;color:var(--np-text)!important;
  border-radius:8px!important;transition:transform .5s var(--silk),border-color .5s var(--silk),background .5s var(--silk)!important
}
.theme-btn:hover,.menu-btn:hover{border-color:var(--np-sky)!important;background:var(--np-bg3)!important;transform:translateY(-2px)!important}
.hero{position:relative;overflow:hidden}
.hero:before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:-1;
  background:radial-gradient(circle at 85% 20%,rgba(74,158,232,.10),transparent 38%);
}
.eyebrow{color:var(--np-sky)!important;letter-spacing:.12em!important}
.hero p,.sub,.ask-hint,.muted,.stage-state,.progress-head,.legend span{color:var(--np-text2)!important}
.hero-badge,.legend span{
  background:rgba(74,158,232,.06)!important;border-color:rgba(74,158,232,.25)!important;color:var(--np-sky2)!important;
}
.progress-panel,.ask-section,.stage{
  background:linear-gradient(145deg,var(--np-bg3),var(--np-bg2))!important;
  border-color:var(--np-border)!important;box-shadow:0 20px 55px rgba(0,0,0,.22)!important;
  border-radius:12px!important;
  transition:transform .7s var(--silk),border-color .7s var(--silk),box-shadow .7s var(--silk)!important;
}
.stage:hover{transform:translateY(-4px)!important;border-color:var(--np-sky)!important;box-shadow:0 24px 65px rgba(0,0,0,.3),0 0 0 1px rgba(74,158,232,.08)!important}
.stage.review{border-color:#4f5570!important;background:linear-gradient(145deg,#202737,var(--np-bg2))!important}
.stage .num,.open,.pass{color:var(--np-sky)!important}
.lock{color:#c6a75b!important}
.actions a{
  background:var(--np-bg2)!important;border-color:var(--np-border2)!important;color:var(--np-text)!important;
  border-radius:7px!important;transition:transform .5s var(--silk),border-color .5s var(--silk),background .5s var(--silk)!important;
}
.actions a:hover{background:var(--np-bg3)!important;border-color:var(--np-sky)!important;transform:translateY(-2px)!important}
.actions a.exam,.ask-send,.primary{
  background:var(--np-sky)!important;border-color:var(--np-sky)!important;color:#081321!important;
  transition:transform .5s var(--silk),background .5s var(--silk),box-shadow .5s var(--silk)!important;
}
.actions a.exam:hover,.ask-send:hover,.primary:hover{background:var(--np-sky2)!important;transform:translateY(-2px)!important;box-shadow:0 12px 32px rgba(74,158,232,.22)!important}
.secondary{background:transparent!important;color:var(--np-text2)!important;border-color:var(--np-border2)!important}
.path .road{stroke:var(--np-sky)!important}.path .road-glow{stroke:var(--np-sky)!important}.path .road-dot{fill:var(--np-sky2)!important}
.ask-select,.ask-textarea{
  background:var(--np-bg2)!important;color:var(--np-text)!important;border-color:var(--np-border2)!important;border-radius:8px!important;
}
.ask-select:focus,.ask-textarea:focus{border-color:var(--np-sky)!important;box-shadow:0 0 0 3px rgba(74,158,232,.10)!important}
/* softer reveal language */
.stage,.progress-panel,.ask-section{animation:none}
@media(max-width:700px){.stage{border-radius:10px!important}}
/* Light mode keeps the same blue editorial identity */
:root[data-theme="light"]{
  --np-bg:#f4f7fa;--np-bg2:#eaf0f6;--np-bg3:#ffffff;--np-bg4:#f1f5f9;
  --np-text:#142333;--np-text2:#60788d;--np-text3:#7d8e9d;--np-border:#c8d7e5;--np-border2:#afc3d5;
  --np-sky:#3d86c9;--np-sky2:#5aa9e8;--np-sky3:#2a6aaa;
  --bg:var(--np-bg);--bg2:var(--np-bg2);--panel:var(--np-bg3);--panel2:var(--np-bg4);
  --line:var(--np-border);--teal:var(--np-sky3);--teal2:var(--np-sky);--text:var(--np-text);--muted:var(--np-text2);
  --good:var(--np-green);--bad:var(--np-red);
}
:root[data-theme="light"] body{background:var(--np-bg)!important}
:root[data-theme="light"] body:before{opacity:.20}
:root[data-theme="light"] .navbar{background:rgba(244,247,250,.86)!important}
:root[data-theme="light"] .progress-panel,
:root[data-theme="light"] .ask-section,
:root[data-theme="light"] .stage{background:linear-gradient(145deg,#fff,#edf3f7)!important;box-shadow:0 18px 45px rgba(20,35,51,.08)!important}
:root[data-theme="light"] .stage.review{background:linear-gradient(145deg,#f4f5f8,#fff)!important}

</style></head><body><button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle theme" aria-pressed="false"><span id="themeIcon">☀</span> <span data-theme-label>Dark mode</span></button><main class="shell"><div id="app"></div></main><script>
const PASS=60,STAGE_ID=2,PREREQ_STAGE_ID=1,KEY="program1sec_exam_";
const EXAM={"id": 2, "title": "Chapter 2: Regulations and Rights in the Information Society", "questions": [{"num": 1, "type": "tf", "text": "تنطبق أحكام قانون حماية البيانات الشخصية على الأحياء والمتوفين لمدة 50 سنة بعد الوفاة.  (   )", "options": [], "answer": "false", "explanation": "القانون ينطبق فقط على الأشخاص الطبيعيين الأحياء (Living natural persons)."}, {"num": 2, "type": "tf", "text": "تشمل العناصر الأساسية الأربعة للبيانات الشخصية: الاسم، العنوان، تاريخ الميلاد، والجنس.  (   )", "options": [], "answer": "true", "explanation": "هذه هي العناصر الأساسية الأربعة المحددة صراحة بالقانون."}, {"num": 3, "type": "tf", "text": "يُعتبر رقم الجواز ورقم رخصة القيادة من أكواد التعريف الشخصي (Personal Identification Codes).  (   )", "options": [], "answer": "true", "explanation": "الأرقام الوطنية والفريدة تُصنف كأكواد تعريف شخصية."}, {"num": 4, "type": "tf", "text": "تُصنف بيانات السجل الطبي والعرق والعقيدة والسجل الإجرامي كبيانات ذات عناية خاصة.  (   )", "options": [], "answer": "true", "explanation": "تتطلب عناية خاصة لمنع التمييز والضرر بالإنسان."}, {"num": 5, "type": "tf", "text": "يُحظر تقديم البيانات الشخصية لطرف ثالث دون موافقة الشخص حتى لحماية حياة الإنسان.  (   )", "options": [], "answer": "false", "explanation": "حماية حياة الإنسان والصحة العامة من الاستثناءات القانونية المسموح بها دون إذن."}, {"num": 6, "type": "tf", "text": "تُحمى حقوق الخصوصية والصورة والعلانية بناءً على سوابق قضائية (Precedents).  (   )", "options": [], "answer": "true", "explanation": "جرى الاعتراف بهذه الحقوق وتطويرها عبر السوابق القضائية وليس قانون مكتوب صريح."}, {"num": 7, "type": "tf", "text": "يُقصد بحقوق العلانية (Publicity Rights) حق الأفراد العاديين في منع تصويرهم.  (   )", "options": [], "answer": "false", "explanation": "حقوق العلانية تحمي القيمة الاقتصادية لشهرة المشاهير، بينما تصوير العاديين يخص حق الصورة."}, {"num": 8, "type": "tf", "text": "يُعرف نظام الاعتراض (Objection system) بأنه النظام الذي يمنع الجمع إلا بموافقة مسبقة.  (   )", "options": [], "answer": "false", "explanation": "هذا تعريف نظام الموافقة المسبقة (Prior Approval / Opt-in)، أما الاعتراض فيستمر حتى يطلب التوقف."}, {"num": 9, "type": "tf", "text": "تخضع حقوق الملكية الصناعية لمبدأ عدم الشكلية وتنشأ بمجرد الابتكار.  (   )", "options": [], "answer": "false", "explanation": "الملكية الصناعية تخضع لمبدأ الشكلية (Formality) وتتطلب تسجيلاً رسمياً لدى مكتب البراءات."}, {"num": 10, "type": "tf", "text": "تمتد فترة حماية حقوق التصميم (Design rights) لمدة 10 سنوات من تقديم الطلب وتجدد.  (   )", "options": [], "answer": "true", "explanation": "حقوق التصميم تحمي الشكل الخارجي والأنماط لمدة 10 سنوات وتجدد مرة كل 5 سنوات."}, {"num": 11, "type": "tf", "text": "تنشأ حقوق الطبع والنشر وفق مبدأ عدم الشكلية وتُحمى بمجرد الابتكار دون تسجيل.  (   )", "options": [], "answer": "true", "explanation": "حقوق النشر لا تتطلب أي إجراءات تسجيل رسمية لتفعيل الحماية."}, {"num": 12, "type": "tf", "text": "يحمي الحق الأدبي للمؤلف (Moral rights) المصالح المالية والاقتصادية للعمل.  (   )", "options": [], "answer": "false", "explanation": "الحق الأدبي يحمي شخصية المؤلف وسمعته، بينما الحق المادي (Property right) يحمي المصالح المالية."}, {"num": 13, "type": "tf", "text": "تُمنح الحقوق المجاورة للمؤدين مثل المغنين والممثلين وشركات التسجيل والإذاعة.  (   )", "options": [], "answer": "true", "explanation": "الحقوق المجاورة تُخصص لمن ينقلون ويؤدون العمل الفني للجمهور."}, {"num": 14, "type": "tf", "text": "نسخ المواد الدراسية وتوزيعها على الطلاب داخل الفصل لأغراض التدريس يُعد استثناءً مسموحاً.  (   )", "options": [], "answer": "true", "explanation": "يُعد الاستخدام في المؤسسات التعليمية من استثناءات الاستخدام العادل القانونية."}, {"num": 15, "type": "tf", "text": "يُشترط في الاقتباس القانوني السليم أن يكون النص المقتبس هو الجزء الأساسي والرئيسي بالعمل.  (   )", "options": [], "answer": "false", "explanation": "يجب أن يكون النص المقتبس فرعياً وتابعاُ (Subordinate) للعمل الجديد الأساسي."}, {"num": 16, "type": "mcq", "text": "أي من البيانات التالية يُصنف ضمن أكواد التعريف الشخصي؟", "options": [{"id": "A", "text": "تاريخ الميلاد والجنس"}, {"id": "B", "text": "رقم الجواز ورخصة القيادة"}, {"id": "C", "text": "الاسم والعنوان"}, {"id": "D", "text": "السجل الطبي والعرق"}], "answer": "B", "explanation": "رقم الجواز ورخصة القيادة من الأرقام التعريفية الفريدة."}, {"num": 17, "type": "mcq", "text": "المستند الذي تنشره الشركة لتوضيح قواعد حماية البيانات يُسمى:", "options": [{"id": "A", "text": "ترخيص المشاع الإبداعي"}, {"id": "B", "text": "سياسة الخصوصية (Privacy Policy)"}, {"id": "C", "text": "الحقوق المجاورة"}, {"id": "D", "text": "وثيقة الاقتباس"}], "answer": "B", "explanation": "سياسة الخصوصية تحدد كيفية إدارة وحماية بيانات المستخدمين."}, {"num": 18, "type": "mcq", "text": "النظام الذي يستمر في تقديم الخدمة حتى يطلب المستخدم التوقف بنفسه يُسمى:", "options": [{"id": "A", "text": "نظام الموافقة المسبقة"}, {"id": "B", "text": "نظام الاعتراض (Objection system)"}, {"id": "C", "text": "مبدأ الشكلية"}, {"id": "D", "text": "مبدأ عدم الشكلية"}], "answer": "B", "explanation": "نظام الاعتراض (Opt-out) يستمر افتراضياً حتى يطلب المستخدم إيقافه."}, {"num": 19, "type": "mcq", "text": "المبدأ الذي يشترط تسجيل الملكية الصناعية رسمياً لدى مكتب البراءات هو:", "options": [{"id": "A", "text": "مبدأ عدم الشكلية"}, {"id": "B", "text": "مبدأ الشكلية (Formality Principle)"}, {"id": "C", "text": "مبدأ الاستخدام العادل"}, {"id": "D", "text": "مبدأ الاقتباس"}], "answer": "B", "explanation": "مبدأ الشكلية يشترط إجراءات وتسجيل رسمي للحصول على الحماية."}, {"num": 20, "type": "mcq", "text": "تستمر فترة حماية براءة الاختراع (Patent Rights) لمدة:", "options": [{"id": "A", "text": "7 سنوات"}, {"id": "B", "text": "10 سنوات"}, {"id": "C", "text": "20 سنة من تقديم الطلب"}, {"id": "D", "text": "حياة المخترع + 50 سنة"}], "answer": "C", "explanation": "براءة الاختراع تُمنح لمدة 20 سنة من تاريخ تقديم الطلب."}, {"num": 21, "type": "mcq", "text": "الحقوق التي تحمي الهيكل الداخلي أو التركيب العملي لمنتج وتستمر 7 سنوات هي:", "options": [{"id": "A", "text": "حقوق التصميم"}, {"id": "B", "text": "حقوق نموذج المنفعة (Utility Model)"}, {"id": "C", "text": "حقوق العلامة التجارية"}, {"id": "D", "text": "حقوق الطبع والنشر"}], "answer": "B", "explanation": "حقوق نموذج المنفعة تحمي الأفكار والتركيبات العملية لـ 7 سنوات."}, {"num": 22, "type": "mcq", "text": "مدة حماية حقوق العلامات التجارية (Trademark Rights) هي:", "options": [{"id": "A", "text": "20 سنة غير قابلة للتجديد"}, {"id": "B", "text": "10 سنوات قابلة للتجديد"}, {"id": "C", "text": "7 سنوات"}, {"id": "D", "text": "حياة المؤلف + 50 سنة"}], "answer": "B", "explanation": "تُمنح العلامة التجارية لـ 10 سنوات من التسجيل وتُجدد لمدد مماثلة."}, {"num": 23, "type": "mcq", "text": "أي الفئات التالية تتمتع بالحقوق المجاورة (Neighboring Rights)؟", "options": [{"id": "A", "text": "مؤلفو الكتب والروايات"}, {"id": "B", "text": "المغنون والممثلون وشركات التسجيل"}, {"id": "C", "text": "مخترعو الأجهزة الطبية"}, {"id": "D", "text": "مصممو الشعارات"}], "answer": "B", "explanation": "الحقوق المجاورة تُمنح لمن ينقلون ويؤدون الأعمال الفنية."}, {"num": 24, "type": "mcq", "text": "تستمر حماية الحقوق المادية للمؤلف بموجب قانون حقوق النشر لمدة:", "options": [{"id": "A", "text": "20 سنة من النشر"}, {"id": "B", "text": "10 سنوات"}, {"id": "C", "text": "طوال حياة المؤلف + 50 سنة بعد وفاته"}, {"id": "D", "text": "7 سنوات"}], "answer": "C", "explanation": "تمتد حماية الحقوق المادية طوال حياة المؤلف و50 عاماً بعد الوفاة."}, {"num": 25, "type": "mcq", "text": "أي مما يلي يُعد من الاستثناءات المسموح بها لاستخدام الأعمال المحمية دون إذن؟", "options": [{"id": "A", "text": "نسخ أسطوانة غنائية وتوزيعها مجاناً"}, {"id": "B", "text": "نسخ مواد دراسية داخل الفصل للشرح"}, {"id": "C", "text": "إقامة حفل مدفوع بأغانٍ محددة"}, {"id": "D", "text": "رفع كتاب كاملاً على موقع شخصي"}], "answer": "B", "explanation": "النسخ للأغراض التعليمية داخل الفصول استثناء مجاني مسموح به."}, {"num": 26, "type": "mcq", "text": "من الشروط الأساسية للاقتباس (Quotation) القانوني السليم:", "options": [{"id": "A", "text": "تعديل النص المقتبس"}, {"id": "B", "text": "وضعه بين علامتي تنصيص وتحديد المصدر بدقة"}, {"id": "C", "text": "جعله الجزء الأكبر من العمل"}, {"id": "D", "text": "إخفاء اسم المؤلف الأصلي"}], "answer": "B", "explanation": "يلزم وضع علامات التنصيص وعزو المصدر بوضوح وعدم التعديل."}, {"num": 27, "type": "mcq", "text": "رمز ترخيص المشاع الإبداعي الذي يمنع الاستخدام التجاري للعمل هو:", "options": [{"id": "A", "text": "BY"}, {"id": "B", "text": "NC"}, {"id": "C", "text": "ND"}, {"id": "D", "text": "SA"}], "answer": "B", "explanation": "الرمز NC يعني (Non-commercial) ويمنع الاستخدام في التجارة."}, {"num": 28, "type": "mcq", "text": "رمز ترخيص المشاع الإبداعي الذي يمنع تعديل أو تحريف العمل الأصلي هو:", "options": [{"id": "A", "text": "BY"}, {"id": "B", "text": "NC"}, {"id": "C", "text": "ND"}, {"id": "D", "text": "SA"}], "answer": "C", "explanation": "الرمز ND يرمز لـ (No derivatives) ويمنع أي تعديلات."}, {"num": 29, "type": "mcq", "text": "الحق الذي يمنع الآخرين من التقاط صورة لشخص أو استخدام وجهه دون إذنه هو:", "options": [{"id": "A", "text": "حق الخصوصية"}, {"id": "B", "text": "حق الصورة (Image Rights)"}, {"id": "C", "text": "حق العلانية"}, {"id": "D", "text": "حق العلامة التجارية"}], "answer": "B", "explanation": "حق الصورة يحمي مظهر الفرد ووجهه من التصوير والاستغلال دون إذنه."}, {"num": 30, "type": "mcq", "text": "شرط (SA) في تراخيص المشاع الإبداعي يشترط:", "options": [{"id": "A", "text": "نسب العمل للمبتكر"}, {"id": "B", "text": "حظر الاستخدام التجاري"}, {"id": "C", "text": "نشر العمل المعدل بنفس ترخيص العمل الأصلي"}, {"id": "D", "text": "منع التعديل"}], "answer": "C", "explanation": "الرمز SA يعني (ShareAlike) أي التزام الترخيص نفسه بالأعمال المشتقة."}]};
const NEXT="test3.html";
const unlocked=()=>STAGE_ID===1||localStorage.getItem(KEY+PREREQ_STAGE_ID)==="passed";
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const app=document.getElementById("app");
if(!unlocked()){app.innerHTML=`<div class="card"><div class="badge">LOCKED</div><h1>هذه المرحلة مغلقة 🔒</h1><p class="muted">يجب اجتياز المرحلة السابقة بنسبة ${PASS}% أو أكثر.</p><button class="primary" onclick="location.href='index.html'">← خريطة المراحل</button></div>`}
else{
let idx=0,answers={};
function render(){
 const q=EXAM.questions[idx],pct=Math.round(idx/EXAM.questions.length*100),opts=q.type==="tf"?[{id:"true",text:"✓ صواب"},{id:"false",text:"✕ خطأ"}]:q.options;
 app.innerHTML=`<div class="card"><div class="top"><div class="badge">STAGE ${String(STAGE_ID).padStart(2,"0")} // EXAM</div><div class="badge">${idx+1} / ${EXAM.questions.length}</div></div>
 <h1>${esc(EXAM.title)}</h1><div class="progress"><i style="width:${pct}%"></i></div><div class="qmeta"><span>QUESTION ${q.num}</span><span>${q.type==="tf"?"TRUE / FALSE":"MULTIPLE CHOICE"}</span></div>
 <div class="question">${esc(q.text)}</div><div class="options">${opts.map(o=>`<label class="option ${answers[q.num]===o.id?"selected":""}"><input type="radio" name="answer" value="${o.id}" ${answers[q.num]===o.id?"checked":""}><span>${esc(o.text)}</span></label>`).join("")}</div>
 <div id="feedback" class="feedback"></div><div class="actions"><button class="secondary" ${idx===0?"disabled":""} id="back">← السابق</button><button class="primary" id="next">${idx===29?"إنهاء الامتحان":"السؤال التالي →"}</button></div></div>`;
 document.querySelectorAll('input[name="answer"]').forEach(r=>r.onchange=e=>{answers[q.num]=e.target.value;document.querySelectorAll(".option").forEach(x=>x.classList.remove("selected"));e.target.closest(".option").classList.add("selected");showFeedback(q)});
 document.getElementById("back").onclick=()=>{idx--;render()};document.getElementById("next").onclick=()=>{if(!answers[q.num])return alert("اختر إجابة أولاً.");idx<29?(idx++,render()):finish()};
}
function showFeedback(q){

 let correctText=correct;
 if(q.type==="tf")correctText=correct==="true"?"صواب":"خطأ";else{const o=q.options.find(x=>x.id===correct);if(o)correctText=o.text}
 box.className="feedback show "+(ok?"good":"bad");
 box.innerHTML=ok
 ?`<strong class="good">✓ إجابتك صحيحة</strong><div><b>لماذا هي صحيحة؟</b><br>${esc(q.explanation)}</div>`
 :`<strong class="bad">✕ إجابتك غير صحيحة</strong><div class="answer"><b>الإجابة الصحيحة:</b> ${esc(correctText)}</div><div><b>التفسير العلمي من المصدر:</b><br>${esc(q.explanation)}</div>`;
}
function finish(){
 let correct=EXAM.questions.filter(q=>answers[q.num]===q.answer).length,pct=Math.round(correct/30*100),passed=pct>=PASS;
 if(passed)localStorage.setItem(KEY+STAGE_ID,"passed");
 app.innerHTML=`<div class="card result"><div class="badge">TEST COMPLETE</div><h1>${esc(EXAM.title)}</h1><div class="score ${passed?"good":"bad"}">${pct}%</div><div class="score ${passed?"good":"bad"}">${passed?"✓ PASS":"✕ FAILED"}</div>
 <div class="stats"><div><b>${correct}</b>صحيحة</div><div><b>${30-correct}</b>خطأ</div><div><b>30</b>إجمالي</div></div><p class="muted">درجة النجاح: ${PASS}%</p>
 <div class="actions"><button class="secondary" onclick="location.reload()">إعادة الاختبار</button><button class="primary" onclick="location.href='index.html'">← خريطة المراحل</button>${passed&&NEXT?`<button class="primary" onclick="location.href=NEXT">المرحلة التالية →</button>`:""}</div></div>`;
}
render();
}
</script>
<script>
(function(){
  const THEME_KEY='program1sec-theme';
  const root=document.documentElement;
  const button=document.getElementById('themeToggle');
  const icon=document.getElementById('themeIcon');
  const label=button?button.querySelector('[data-theme-label]'):null;
  function applyTheme(theme,save=true){
    const value=theme==='dark'?'dark':'light';
    root.setAttribute('data-theme',value);
    root.classList.toggle('dark',value==='dark');
    root.classList.toggle('light',value==='light');
    if(icon) icon.textContent=value==='dark'?'☀':'☾';
    if(label) label.textContent=value==='dark'?'Light mode':'Dark mode';
    if(button){button.setAttribute('aria-pressed',value==='dark'?'true':'false');button.title=value==='dark'?'Switch to light mode':'Switch to dark mode';}
    if(save){try{localStorage.setItem(THEME_KEY,value)}catch(e){}}
  }
  let saved=null;try{saved=localStorage.getItem(THEME_KEY)}catch(e){}
  const initial=(saved==='dark'||saved==='light')?saved:((window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light');
  applyTheme(initial,false);
  if(button) button.addEventListener('click',()=>applyTheme(root.getAttribute('data-theme')==='dark'?'light':'dark'));
})();
</script>
