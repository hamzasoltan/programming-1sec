/* PROGRAM 1SEC — NovaPay-inspired visual system */
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Outfit:wght@500;600;700;800&display=swap');
:root{
  --np-bg:#0F1319;--np-bg2:#141920;--np-bg3:#1A2130;--np-bg4:#1E2838;
  --np-sky:#4A9EE8;--np-sky2:#7EC8F0;--np-sky3:#2A6AAA;
  --np-text:#E4EEF8;--np-text2:#8AAEC8;--np-text3:#506070;
  --np-border:#1E3050;--np-border2:#2A4060;
  --np-green:#3DCC8E;--np-red:#E85A5A;
  --bg:var(--np-bg);--bg2:var(--np-bg2);--panel:var(--np-bg3);--panel2:var(--np-bg4);
  --line:var(--np-border);--teal:var(--np-sky3);--teal2:var(--np-sky);--text:var(--np-text);--muted:var(--np-text2);
  --good:var(--np-green);--bad:var(--np-red);
  --silk:cubic-bezier(.16,1,.3,1);
}
html{scroll-behavior:smooth}
body{
  font-family:'DM Sans',sans-serif!important;
  background:var(--np-bg)!important;color:var(--np-text)!important;
  transition:background .7s var(--silk),color .7s var(--silk)!important;
}
h1,h2,h3,.brand,.title,.score,.stage .num,.eyebrow,.ask-title{font-family:'Outfit',sans-serif!important;letter-spacing:-.02em}
/* layered diagonal grid / editorial background */
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.32;
  background-image:
    repeating-linear-gradient(45deg,transparent 0,transparent 119px,rgba(74,158,232,.13) 119px,rgba(74,158,232,.13) 120px),
    repeating-linear-gradient(-45deg,transparent 0,transparent 119px,rgba(74,158,232,.08) 119px,rgba(74,158,232,.08) 120px);
  mask-image:radial-gradient(ellipse 90% 80% at 50% 0,#000 0%,transparent 82%);
}
.navbar{
  background:rgba(15,19,25,.78)!important;border-bottom:1px solid var(--np-border)!important;
  backdrop-filter:blur(20px)!important;
  box-shadow:0 12px 40px rgba(0,0,0,.18);
}
.nav-inner{height:68px}
.brand{font-weight:800!important;color:var(--np-text)!important}
.brand span{color:var(--np-sky)!important}
.nav-links a,.mobile-menu a{color:var(--np-text2)!important;transition:color .5s var(--silk),background .5s var(--silk),transform .5s var(--silk)!important}
.nav-links a:hover,.mobile-menu a:hover{color:var(--np-text)!important;transform:translateY(-1px)}
.theme-btn,.menu-btn{
  background:var(--np-bg2)!important;border:1px solid var(--np-border2)!important;color:var(--np-text)!important;
  border-radius:8px!important;transition:transform .5s var(--silk),border-color .5s var(--silk),background .5s var(--silk)!important
}
.theme-btn:hover,.menu-btn:hover{border-color:var(--np-sky)!important;background:var(--np-bg3)!important;transform:translateY(-2px)!important}
.hero{position:relative;overflow:hidden}
.hero:before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:-1;
  background:radial-gradient(circle at 85% 20%,rgba(74,158,232,.10),transparent 38%);
}
.eyebrow{color:var(--np-sky)!important;letter-spacing:.12em!important}
.hero p,.sub,.ask-hint,.muted,.stage-state,.progress-head,.legend span{color:var(--np-text2)!important}
.hero-badge,.legend span{
  background:rgba(74,158,232,.06)!important;border-color:rgba(74,158,232,.25)!important;color:var(--np-sky2)!important;
}
.progress-panel,.ask-section,.stage{
  background:linear-gradient(145deg,var(--np-bg3),var(--np-bg2))!important;
  border-color:var(--np-border)!important;box-shadow:0 20px 55px rgba(0,0,0,.22)!important;
  border-radius:12px!important;
  transition:transform .7s var(--silk),border-color .7s var(--silk),box-shadow .7s var(--silk)!important;
}
.stage:hover{transform:translateY(-4px)!important;border-color:var(--np-sky)!important;box-shadow:0 24px 65px rgba(0,0,0,.3),0 0 0 1px rgba(74,158,232,.08)!important}
.stage.review{border-color:#4f5570!important;background:linear-gradient(145deg,#202737,var(--np-bg2))!important}
.stage .num,.open,.pass{color:var(--np-sky)!important}
.lock{color:#c6a75b!important}
.actions a{
  background:var(--np-bg2)!important;border-color:var(--np-border2)!important;color:var(--np-text)!important;
  border-radius:7px!important;transition:transform .5s var(--silk),border-color .5s var(--silk),background .5s var(--silk)!important;
}
.actions a:hover{background:var(--np-bg3)!important;border-color:var(--np-sky)!important;transform:translateY(-2px)!important}
.actions a.exam,.ask-send,.primary{
  background:var(--np-sky)!important;border-color:var(--np-sky)!important;color:#081321!important;
  transition:transform .5s var(--silk),background .5s var(--silk),box-shadow .5s var(--silk)!important;
}
.actions a.exam:hover,.ask-send:hover,.primary:hover{background:var(--np-sky2)!important;transform:translateY(-2px)!important;box-shadow:0 12px 32px rgba(74,158,232,.22)!important}
.secondary{background:transparent!important;color:var(--np-text2)!important;border-color:var(--np-border2)!important}
.path .road{stroke:var(--np-sky)!important}.path .road-glow{stroke:var(--np-sky)!important}.path .road-dot{fill:var(--np-sky2)!important}
.ask-select,.ask-textarea{
  background:var(--np-bg2)!important;color:var(--np-text)!important;border-color:var(--np-border2)!important;border-radius:8px!important;
}
.ask-select:focus,.ask-textarea:focus{border-color:var(--np-sky)!important;box-shadow:0 0 0 3px rgba(74,158,232,.10)!important}
/* softer reveal language */
.stage,.progress-panel,.ask-section{animation:none}
@media(max-width:700px){.stage{border-radius:10px!important}}
/* Light mode keeps the same blue editorial identity */
:root[data-theme="light"]{
  --np-bg:#f4f7fa;--np-bg2:#eaf0f6;--np-bg3:#ffffff;--np-bg4:#f1f5f9;
  --np-text:#142333;--np-text2:#60788d;--np-text3:#7d8e9d;--np-border:#c8d7e5;--np-border2:#afc3d5;
  --np-sky:#3d86c9;--np-sky2:#5aa9e8;--np-sky3:#2a6aaa;
  --bg:var(--np-bg);--bg2:var(--np-bg2);--panel:var(--np-bg3);--panel2:var(--np-bg4);
  --line:var(--np-border);--teal:var(--np-sky3);--teal2:var(--np-sky);--text:var(--np-text);--muted:var(--np-text2);
  --good:var(--np-green);--bad:var(--np-red);
}
:root[data-theme="light"] body{background:var(--np-bg)!important}
:root[data-theme="light"] body:before{opacity:.20}
:root[data-theme="light"] .navbar{background:rgba(244,247,250,.86)!important}
:root[data-theme="light"] .progress-panel,
:root[data-theme="light"] .ask-section,
:root[data-theme="light"] .stage{background:linear-gradient(145deg,#fff,#edf3f7)!important;box-shadow:0 18px 45px rgba(20,35,51,.08)!important}
:root[data-theme="light"] .stage.review{background:linear-gradient(145deg,#f4f5f8,#fff)!important}

const PASS=60,STAGE_ID=10,PREREQ_STAGE_ID=9,KEY="program1sec_exam_";
const EXAM={"id": 8, "title": "Chapter 8: Networks", "questions": [{"num": 1, "type": "tf", "text": "تُعرف شبكة الحاسوب (Computer Network) بأنها نظام ربط أجهزة حاسوبية لتبادل البيانات.  (   )", "options": [], "answer": "true", "explanation": "هذا هو التعريف الصريح لشبكة الحاسوب."}, {"num": 2, "type": "tf", "text": "شبكة LAN هي شبكة تغطي مساحات جغرافية شاسعة كالدول والقارات.  (   )", "options": [], "answer": "false", "explanation": "شبكة LAN تغطي نطاقاً محدوداً كالمدرسة أو المنزل، بينما تغطي شبكة WAN المساحات الشاسعة."}, {"num": 3, "type": "tf", "text": "الإنترنت هو شبكة عالمية تربط بين شبكات LAN وWAN حول العالم.  (   )", "options": [], "answer": "true", "explanation": "الإنترنت هو شبكة الشبكات العالمية المترابطة."}, {"num": 4, "type": "tf", "text": "عنوان IP هو رقم تعريفي فريد يُخصص لكل جهاز على الشبكة لتحديد موقعه.  (   )", "options": [], "answer": "true", "explanation": "عنوان IP يعادل العنوان البريدي للأجهزة الشبكية."}, {"num": 5, "type": "tf", "text": "يتكون عنوان IPv4 من 32 بت مقسمة على 4 أجزاء يفصل بينها نقاط.  (   )", "options": [], "answer": "true", "explanation": "IPv4 يتألف من 32 بت مقسمة لـ 4 خانات بمدى من 0 لـ 255."}, {"num": 6, "type": "tf", "text": "بروتوكول الاتصال (Protocol) هو الاتفاق والقواعد الموحدة المتبعة لنقل البيانات بالشبكة.  (   )", "options": [], "answer": "true", "explanation": "البروتوكول يحدد أساليب وضوابط تبادل البيانات."}, {"num": 7, "type": "tf", "text": "في طريقة التبديل بالتحويل الدائري (Circuit switching)، تُشغل القناة بالكامل للمتصلين طوال فترة الاتصال.  (   )", "options": [], "answer": "true", "explanation": "Circuit switching تحجز المسار بالكامل للمتصلين حتى انتهاء المكالمة."}, {"num": 8, "type": "tf", "text": "طريقة تبديل الحزم (Packet switching) تقسم البيانات إلى حزم صغيرة وتشارك القناة مع مستخدمين آخرين.  (   )", "options": [], "answer": "true", "explanation": "Packet switching تقسم البيانات لحزم حرة المسار وتتشارك الخطوط."}, {"num": 9, "type": "tf", "text": "بروتوكول TCP يقوم بتقسيم البيانات إلى حزم وإعادة ترتيبها والتأكد من وصولها دون فقدان.  (   )", "options": [], "answer": "true", "explanation": "TCP يضمن الموثوقية وإعادة ترتيب الحزم وإعادة إرسال المفقود."}, {"num": 10, "type": "tf", "text": "بروتوكول UDP يركز على السرعة والبث المباشر المباشر دون إعادة إرسال الحزم المفقودة.  (   )", "options": [], "answer": "true", "explanation": "UDP مستخدم للبث المباشر والمكالمات لسرعته وعدم انتظار الإعادة."}, {"num": 11, "type": "tf", "text": "طريقة نموذج العميل والشارح (Client-Server) تُوزع الأدوار بين أجهزة تقدم الخدمات وأجهزة تطلبها.  (   )", "options": [], "answer": "true", "explanation": "Client-Server يحدد أجهزة كخوادم تقدم الخدمة وأجهزة كعملاء تطلبها."}, {"num": 12, "type": "tf", "text": "اسم النطاق (Domain Name) هو الاسم الحرفي المسهل للوصول للمواقع بدلاً من حفظ أرقام IP الصعبة.  (   )", "options": [], "answer": "true", "explanation": "Domain Name يترجم الأرقام لمسميات حرفية سهلة القراءة والتذكر."}, {"num": 13, "type": "tf", "text": "الموجه (Router) هو جهاز يربط بين شبكات مختلفة ويوجه الحزم لأفضل مسار.  (   )", "options": [], "answer": "true", "explanation": "Router يوجه الحزم بين الشبكات المتباينة بناء على عناوين IP."}, {"num": 14, "type": "tf", "text": "يتكون نموذج TCP/IP المعتمد بالإنترنت من 7 طبقات متتالية.  (   )", "options": [], "answer": "false", "explanation": "نموذج TCP/IP يتكون من 4 طبقات رئيسية وليس 7."}, {"num": 15, "type": "tf", "text": "بروتوكول HTTP يُستخدم لنقل صفحات الويب واستعراضها بالمتصفح.  (   )", "options": [], "answer": "true", "explanation": "HTTP هو البروتوكول المخصص لنقل واستعراض صفحات الويب."}, {"num": 16, "type": "mcq", "text": "الشبكة التي تربط أجهزة داخل نطاق جغرافي محدود كمنزل أو مدرسة تُسمى:", "options": [{"id": "A", "text": "WAN"}, {"id": "B", "text": "LAN (Local Area Network)"}, {"id": "C", "text": "Internet"}, {"id": "D", "text": "Satellite Network"}], "answer": "B", "explanation": "شبكة LAN تغطي نطاقاً محلياً محدوداً."}, {"num": 17, "type": "mcq", "text": "الشبكة الممتدة التي تربط مدناً ودولاً عبر مسافات شاسعة تُسمى:", "options": [{"id": "A", "text": "LAN"}, {"id": "B", "text": "WAN (Wide Area Network)"}, {"id": "C", "text": "PAN"}, {"id": "D", "text": "Home Network"}], "answer": "B", "explanation": "شبكة WAN تحيط بالمساحات الممتدة الشاسعة."}, {"num": 18, "type": "mcq", "text": "عنوان IPv4 يتكون من عدد بتات يساوي:", "options": [{"id": "A", "text": "16 bits"}, {"id": "B", "text": "32 bits"}, {"id": "C", "text": "64 bits"}, {"id": "D", "text": "128 bits"}], "answer": "B", "explanation": "IPv4 بيتكون صراحة من 32 بت مقسمة 4 أجزاء."}, {"num": 19, "type": "mcq", "text": "عنوان IP المكتوب بالصيغة العادية يتألف من 4 أرقام يفصل بينها نقاط بمدى من 0 إلى:", "options": [{"id": "A", "text": "100"}, {"id": "B", "text": "255"}, {"id": "C", "text": "512"}, {"id": "D", "text": "1024"}], "answer": "B", "explanation": "كل جزء من أجزاء IPv4 الثمانية بتات يمتد من 0 لـ 255."}, {"num": 20, "type": "mcq", "text": "الاسم الحرفي المكتوب المترجم لعنوان الـ IP المسهل لقراءة المواقع هو:", "options": [{"id": "A", "text": "MAC Address"}, {"id": "B", "text": "Domain Name (اسم النطاق)"}, {"id": "C", "text": "Router Name"}, {"id": "D", "text": "HTML Code"}], "answer": "B", "explanation": "Domain Name يوفر اسماً نصياً بدلاً من حفظ أرقام IP."}, {"num": 21, "type": "mcq", "text": "طريقة التبديل التي تقسم البيانات إلى قطع صغيرة وتتشارك المسارات تُسمى:", "options": [{"id": "A", "text": "Circuit switching"}, {"id": "B", "text": "Packet switching (تبديل الحزم)"}, {"id": "C", "text": "Analog switching"}, {"id": "D", "text": "Manual switching"}], "answer": "B", "explanation": "Packet switching تقسم البيانات لحزم حرة وتتشارك خطوط الاتصال."}, {"num": 22, "type": "mcq", "text": "البروتوكول المسئول عن الموثوقية وإعادة ترتيب الحزم وإعادة طلب المفقود منها هو:", "options": [{"id": "A", "text": "UDP"}, {"id": "B", "text": "TCP"}, {"id": "C", "text": "IP"}, {"id": "D", "text": "HTTP"}], "answer": "B", "explanation": "TCP يضمن سلامة وترتيب وتوصيل الحزم."}, {"num": 23, "type": "mcq", "text": "البروتوكول السريع المخصص للبث المباشر والمكالمات دون إعطاء أولوية لإعادة الإرسال هو:", "options": [{"id": "A", "text": "TCP"}, {"id": "B", "text": "UDP"}, {"id": "C", "text": "FTP"}, {"id": "D", "text": "SMTP"}], "answer": "B", "explanation": "UDP يركز على السرعة العالية والنقل الفوري دون انتظار."}, {"num": 24, "type": "mcq", "text": "الجهاز المسؤول عن ربط شبكات مختلفة وتوجيه الحزم لأفضل مسار يُسمى:", "options": [{"id": "A", "text": "Hub"}, {"id": "B", "text": "Switch"}, {"id": "C", "text": "Router (الموجه)"}, {"id": "D", "text": "Cable"}], "answer": "C", "explanation": "الراوتر Router يربط الشبكات المختلفة ويوجه الحزم للوجهة الصحيحة."}, {"num": 25, "type": "mcq", "text": "النموذج القياسي لبروتوكولات الإنترنت (TCP/IP Model) يتكون من كم طبقة؟", "options": [{"id": "A", "text": "2 طبقتان"}, {"id": "B", "text": "4 طبقات"}, {"id": "C", "text": "7 طبقات"}, {"id": "D", "text": "10 طبقات"}], "answer": "B", "explanation": "نموذج TCP/IP المعتمد بالشبكة يتألف من 4 طبقات."}, {"num": 26, "type": "mcq", "text": "نظام حاسوبي يُقسم الأدوار إلى أجهزة تطلب الخدمة وأجهزة تقدم الخدمة يُسمى:", "options": [{"id": "A", "text": "Peer-to-Peer"}, {"id": "B", "text": "Client-Server System"}, {"id": "C", "text": "Standalone System"}, {"id": "D", "text": "Offline System"}], "answer": "B", "explanation": "Client-Server يحين أدوار الخوادم والعملاء بالتطبيقات."}, {"num": 27, "type": "mcq", "text": "البروتوكول المسئول عن تحديد عناوين المصدر والوجهة وتوجيه الحزم بالشبكة هو:", "options": [{"id": "A", "text": "HTTP"}, {"id": "B", "text": "TCP"}, {"id": "C", "text": "IP (Internet Protocol)"}, {"id": "D", "text": "UDP"}], "answer": "C", "explanation": "بروتوكول IP يتعامل مع العناوين والتوجيه بالحزم."}, {"num": 28, "type": "mcq", "text": "الطبقة العليا في نموذج TCP/IP التي تتعامل مباشرة مع تطبيقات المستخدم تُسمى:", "options": [{"id": "A", "text": "Network Interface Layer"}, {"id": "B", "text": "Internet Layer"}, {"id": "C", "text": "Transport Layer"}, {"id": "D", "text": "Application Layer"}], "answer": "D", "explanation": "Application Layer تحوي بروتوكولات التطبيقات المباشرة ك const NEXT="test9.html";
const unlocked=()=>STAGE_ID===1||localStorage.getItem(KEY+PREREQ_STAGE_ID)==="passed";
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const app=document.getElementById("app");
if(!unlocked()){app.innerHTML=`<div class="card"><div class="badge">LOCKED</div><h1>هذه المرحلة مغلقة 🔒</h1><p class="muted">يجب اجتياز المرحلة السابقة بنسبة ${PASS}% أو أكثر.</p><button class="primary" onclick="location.href='index.html'">← خريطة المراحل</button></div>`}
else{
let idx=0,answers={};
function render(){
 const q=EXAM.questions[idx],pct=Math.round(idx/EXAM.questions.length*100),opts=q.type==="tf"?[{id:"true",text:"✓ صواب"},{id:"false",text:"✕ خطأ"}]:q.options;
 app.innerHTML=`<div class="card"><div class="top"><div class="badge">STAGE ${String(STAGE_ID).padStart(2,"0")} // EXAM</div><div class="badge">${idx+1} / ${EXAM.questions.length}</div></div>
 <h1>${esc(EXAM.title)}</h1><div class="progress"><i style="width:${pct}%"></i></div><div class="qmeta"><span>QUESTION ${q.num}</span><span>${q.type==="tf"?"TRUE / FALSE":"MULTIPLE CHOICE"}</span></div>
 <div class="question">${esc(q.text)}</div><div class="options">${opts.map(o=>`<label class="option ${answers[q.num]===o.id?"selected":""}"><input type="radio" name="answer" value="${o.id}" ${answers[q.num]===o.id?"checked":""}><span>${esc(o.text)}</span></label>`).join("")}</div>
 <div id="feedback" class="feedback"></div><div class="actions"><button class="secondary" ${idx===0?"disabled":""} id="back">← السابق</button><button class="primary" id="next">${idx===29?"إنهاء الامتحان":"السؤال التالي →"}</button></div></div>`;
 document.querySelectorAll('input[name="answer"]').forEach(r=>r.onchange=e=>{answers[q.num]=e.target.value;document.querySelectorAll(".option").forEach(x=>x.classList.remove("selected"));e.target.closest(".option").classList.add("selected");showFeedback(q)});
 document.getElementById("back").onclick=()=>{idx--;render()};document.getElementById("next").onclick=()=>{if(!answers[q.num])return alert("اختر إجابة أولاً.");idx<29?(idx++,render()):finish()};
}
function showFeedback(q){
 const box=document.getElementById("feedback"),user=answers[q.num],correct=q.answer,ok=user===correct;
 let correctText=correct;
 if(q.type==="tf")correctText=correct==="true"?"صواب":"خطأ";else{const o=q.options.find(x=>x.id===correct);if(o)correctText=o.text}
 box.className="feedback show "+(ok?"good":"bad");
 box.innerHTML=ok
 ?`<strong class="good">✓ إجابتك صحيحة</strong><div><b>لماذا هي صحيحة؟</b><br>${esc(q.explanation)}</div>`
 :`<strong class="bad">✕ إجابتك غير صحيحة</strong><div class="answer"><b>الإجابة الصحيحة:</b> ${esc(correctText)}</div><div><b>التفسير العلمي من المصدر:</b><br>${esc(q.explanation)}</div>`;
}
function finish(){
 let correct=EXAM.questions.filter(q=>answers[q.num]===q.answer).length,pct=Math.round(correct/30*100),passed=pct>=PASS;
 if(passed)localStorage.setItem(KEY+STAGE_ID,"passed");
 app.innerHTML=`<div class="card result"><div class="badge">TEST COMPLETE</div><h1>${esc(EXAM.title)}</h1><div class="score ${passed?"good":"bad"}">${pct}%</div><div class="score ${passed?"good":"bad"}">${passed?"✓ PASS":"✕ FAILED"}</div>
 <div class="stats"><div><b>${correct}</b>صحيحة</div><div><b>${30-correct}</b>خطأ</div><div><b>30</b>إجمالي</div></div><p class="muted">درجة النجاح: ${PASS}%</p>
 <div class="actions"><button class="secondary" onclick="location.reload()">إعادة الاختبار</button><button class="primary" onclick="location.href='index.html'">← خريطة المراحل</button>${passed&&NEXT?`<button class="primary" onclick="location.href=NEXT">المرحلة التالية →</button>`:""}</div></div>`;
}
render();
}
</script>
<script>
(function(){
  const THEME_KEY='program1sec-theme';
  const root=document.documentElement;
  const button=document.getElementById('themeToggle');
  const icon=document.getElementById('themeIcon');
  const label=button?button.querySelector('[data-theme-label]'):null;
  function applyTheme(theme,save=true){
    const value=theme==='dark'?'dark':'light';
    root.setAttribute('data-theme',value);
    root.classList.toggle('dark',value==='dark');
    root.classList.toggle('light',value==='light');
    if(icon) icon.textContent=value==='dark'?'☀':'☾';
    if(label) label.textContent=value==='dark'?'Light mode':'Dark mode';
    if(button){button.setAttribute('aria-pressed',value==='dark'?'true':'false');button.title=value==='dark'?'Switch to light mode':'Switch to dark mode';}
    if(save){try{localStorage.setItem(THEME_KEY,value)}catch(e){}}
  }
  let saved=null;try{saved=localStorage.getItem(THEME_KEY)}catch(e){}
  const initial=(saved==='dark'||saved==='light')?saved:((window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light');
  applyTheme(initial,false);
  if(button) button.addEventListener('click',()=>applyTheme(root.getAttribute('data-theme')==='dark'?'light':'dark'));
})();
</script>
